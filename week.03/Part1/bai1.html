<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Giới Thiệu Bản Thân</title>
  <style>
 

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
       margin: 0;
      background: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    form {
      background: white;
      border: 1px solid #ccc;
      border-radius: 20px;
      padding : 90px 100px; 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 28px;
      border: 1px solid #aaa;
      padding: 15px;
      text-align: center;
      border-radius: 12px;
      background-color: #f7f7f7;
      color: #333;
    }

    .infor span {
      display: block;
      margin-bottom: 15px;
      font-size: 17px;
      line-height: 1.6;
      color: #444;
    }

    .infor strong {
      color: #000;
    }
  </style>
</head>
<body>
  <form>
    <h1>TRANG GIỚI THIỆU BẢN THÂN</h1>
    <div class="infor">
      <span><strong>HỌ VÀ TÊN:</strong> BÙI QUANG THUẬN</span>
      <span><strong>NĂM SINH:</strong> 22/04/2006</span>
      <span><strong>MÔ TẢ BẢN THÂN:</strong> SINH VIÊN NĂM NHẤT ĐẠI HỌC CÔNG NGHIỆP</span>
    </div>
  </form>
</body>
</html>
