<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Menu Điều Hướng</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f9f9f9;
    }

    nav {
      background-color: #007BFF;
      padding: 15px 0;
    }

    .nav-menu {
      display: flex;
      justify-content: center;
      gap: 40px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-menu li a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      position: relative;
      padding: 5px 0;
      transition: color 0.3s ease;
    }

    .nav-menu li a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2px;
      width: 0%;
      background-color: white;
      transition: width 0.3s ease;
    }

    .nav-menu li a:hover {
      color: #cce6ff;
    }

    .nav-menu li a:hover::after {
      width: 100%;
    }
  </style>
</head>
<body>

  <nav>
    <ul class="nav-menu">
      <li><a href="#">Trang chủ</a></li>
      <li><a href="#">Giới thiệu</a></li>
      <li><a href="#">Dịch vụ</a></li>
      <li><a href="#">Tin tức</a></li>
      <li><a href="#">Liên hệ</a></li>
    </ul>
  </nav>

</body>
</html>
