<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin du lịch - Đà Lạt</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
    }

    .section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 5px solid #4CAF50;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 32px;
      color: #333;
    }

    h2 {
      font-size: 24px;
      color: #4CAF50;
    }

    img {
      float: left;
      width: 300px;
      margin-right: 20px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="section">
    <h1>Khám phá Đà Lạt</h1>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Da_Lat_02.jpg/800px-Da_Lat_02.jpg" alt="Ảnh Đà Lạt">
    <p>Đà Lạt là một thành phố cao nguyên nổi tiếng với khí hậu mát mẻ, phong cảnh lãng mạn và nhiều điểm du lịch hấp dẫn như hồ Xuân Hương, thung lũng Tình Yêu, đồi chè Cầu Đất...</p>
  </div>

  <div class="section">
    <h2>Bản đồ</h2>
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3918.770911122179!2d108.430939!3d12.003906!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x317113f86fa9bbf7%3A0x4ff7e029e40925a1!2sDalat%2C%20Lâm%20Đồng!5e0!3m2!1svi!2s!4v1600000000000!5m2!1svi!2s" 
      width="100%" 
      height="300" 
      style="border:0;" 
      allowfullscreen="" 
      loading="lazy">
    </iframe>
  </div>
</body>
</html>
