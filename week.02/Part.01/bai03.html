<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
 table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
}


table {
    background-color:aqua; /* màu xám nhạt */
    border: 1px solid rgb(226, 43, 89);
    border-collapse: collapse;
    width: 100%; /* tùy chỉnh nếu muốn rộng toàn bộ */
}

    h1{
        width: 400px;
        margin: 15px auto;
        padding : 20px; 
       font-family:'Courier New', Courier, monospace ;
        background-color:aquamarine; 
        border-radius: 30px;
    }
    tr{
        
        margin:  auto;
     background-color: beige;
     font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    th{
        width: 300px;
        padding: 15px;
        margin: auto ;
        border-radius: 5px;
    }
    td{
    
        border-radius: 5px;
        margin: 20px auto ;
        padding : 15px;  ;
        text-align: center;
    }
tr:nth-child(even) td {
  background-color: #fce4ec;
}
tr:nth-child(odd) td {
  background-color: #e3f2fd;
}tr:nth-child(odd) th {
  background-color: #e3f2fd;
}

</style>    
</head>
<body>
 <h1>BẢNG THỜI KHÓA BIỂU</h1>
    <table>
      
    <tr>
        <th>MÔN HỌC</th>
        <th>THỨ</th>
        <th>GIỜ HỌC</th>
        <th>PHÒNG HỌC</th>

    </tr>
    <tr>
        <td>KTLT</td>
        <td>BA</td>
        <td>7H30</td>
        <td>H9.03</td>
    </tr>
    <tr>
        <td>TCC</td>
        <td>TƯ</td>
        <td>8H30</td>
        <td>H10.03</td>
    </tr>
    <tr>
        <td>CN.WEB</td>
        <td>BẢY</td>
        <td>10H30</td>
        <td>H11.03</td>
    </tr>
    
    </table>
</body>
</html>
