<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Liên kết điều hướng</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .menu {
      text-align: center;
      margin-top: 50px;
    }

    .link-item {
      margin-bottom: 20px; /* Khoảng cách giữa các dòng */
    }

    .link-item span {
      font-size: 18px;
      font-weight: bold;
      color: #555;
    }

    .link-item a {
      text-decoration: none;
      margin-left: 10px;
      color: #333;
      font-size: 18px;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .link-item a:hover {
      color: #007bff;
    }

    .link-item a:active {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="menu">
    <div class="link-item">
      <span>LINK VÀO FB:</span>
      <a href="https://facebook.com" target="_blank">Facebook</a>
    </div>
    <div class="link-item">
      <span>LINK VÀO YTB:</span>
      <a href="https://youtube.com" target="_blank">YouTube</a>
    </div>
    <div class="link-item">
      <span>LINK VÀO GOOGLE:</span>
      <a href="https://google.com" target="_blank">Google</a>
    </div>
  </div>
</body>
</html>
