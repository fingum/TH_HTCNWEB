<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chèn MP3</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
     display: flex;
     align-items: center;
     justify-content: center;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    .container {
      text-align: center;
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 12px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    audio {
      width: 100%;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chèn file âm thanh MP3</h1>
    <audio controls>
      <source src="gg.mp3" type="audio/mpeg">
      Trình duyệt của bạn không hỗ trợ phát audio.
    </audio>
  </div>
</body>
</html>
