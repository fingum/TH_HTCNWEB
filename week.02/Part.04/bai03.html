<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Tin Tức</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
      margin: 0;
    }

    .news-item {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 4px solid #007BFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .news-item h2 {
      margin-top: 0;
      font-size: 24px;
      color: #333;
    }

    .news-item img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.3s ease;
    }

    .news-item img:hover {
      transform: scale(1.03);
    }

    .news-item p {
      color: #555;
      margin-top: 10px;
      text-align: justify;
    }
  </style>
</head>
<body>

  <div class="news-item">
    <h2>TP.HCM triển khai nhiều giải pháp phòng chống ngập</h2>
    <img src="https://i1-vnexpress.vnecdn.net/2023/10/26/ngap1-1698304084-9727-1698304371.jpg?w=680&h=408&q=100&dpr=1&fit=crop&s=-A2OaTxV6nd2C3V0MvUS1w" alt="Hình ảnh ngập lụt ở TP.HCM">
    <p>Chính quyền TP.HCM đang áp dụng nhiều biện pháp như cải tạo hệ thống thoát nước, nâng cấp cống và tuyên truyền người dân để hạn chế tình trạng ngập úng kéo dài khi mưa lớn.</p>
  </div>

</body>
</html>
